          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PurchasedCourse"
                required:
                  - data
        "400":
          $ref: "#/components/responses/Error400"
        "401":
