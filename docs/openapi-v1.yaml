  /checkout:
    post:
      tags:
        - Cart
      summary: Atomic purchase with idempotent retries
      operationId: post__checkout
      description: Snapshot must match current cart. Prices and availability come from DB. Existing purchases, a
        changed snapshot or key reuse with a different payload return 409. Retrying the same key/payload
        returns 200 and reused=true. Purchase and cart clearing commit together. No payment gateway is
        implemented.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Replayed idempotency key, reused=true
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Checkout"
                required:
                  - data
        "201":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Checkout"
                required:
                  - data
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "500":
          $ref: "#/components/responses/Error500"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idempotencyKey:
                  type: string
                  minLength: 1
                  maxLength: 100
                courseIds:
                  type: array
                  items:
                    type: integer
                    minimum: 1
                    maximum: 2147483647
                  minItems: 1
                  uniqueItems: true
              required:
                - idempotencyKey
                - courseIds
