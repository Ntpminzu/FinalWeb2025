  /me/courses/{courseId}/progress:
    get:
      tags:
        - Learning
      summary: Lectures, progress and overall completion
      operationId: get__me_courses_courseId_progress
      description: ""
      security:
        - BearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CourseProgress"
                required:
