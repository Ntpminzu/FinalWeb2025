openapi: 3.0.3
info:
  title: Online Academy REST API
  version: 1.1.0
  description: JWT API alongside session-based HTML pages. Access tokens expire after 900 seconds; refresh
    cookies after 7 days. Status/isCompleted means course completion, not publication.
servers:
  - url: /api/v1
tags:
  - name: Health
  - name: Auth
  - name: Catalog
  - name: Account
  - name: Learning
  - name: Reviews
  - name: Cart
  - name: Instructor
  - name: Admin
  - name: Chatbot
paths:
  /chatbot/health:
    get:
      tags: [Chatbot]
      summary: Check local chatbot dependencies without generating embeddings
      operationId: getChatbotHealth
      security: []
      responses:
        "200":
          description: Dependency status; needs_sync means the next message creates or updates the index
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [ready, modelReady, sourcesReady, indexState, message]
                    properties:
                      ready: { type: boolean }
                      modelReady: { type: boolean }
                      sourcesReady: { type: boolean }
                      indexState: { type: string, enum: [ready, needs_sync, unavailable] }
                      message: { type: string }
  /chatbot/messages:
    post:
      tags: [Chatbot]
      summary: Recommend public courses and explain website usage for the authenticated role
      operationId: sendChatbotMessage
      description: >-
        Authorization is optional. Missing credentials use public guest sources; invalid or expired
        Bearer credentials return 401. Roles come only from the authenticated account. Catalog and
        allowlisted Markdown sources are synchronized transactionally into PostgreSQL pgvector before retrieval.
        Role and live catalog visibility filters run before exact SQL cosine ordering and LIMIT.
        Both chatbot tables use RLS and are accessible only through the backend. History is context, not evidence.
        The server selects up to three complete recent pairs with a 4000-character budget.
        Limit ten requests per minute per authenticated account, or per guest IP. No account data or
        model prompt/vector payload is returned. Citations are checked for existence, not semantic proof.
      security:
        - {}
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [question]
              properties:
                question: { type: string, minLength: 1, maxLength: 2000 }
                history:
                  type: array
                  maxItems: 20
                  description: Complete alternating user/assistant pairs, maximum 20000 input characters
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role: { type: string, enum: [user, assistant] }
                      content: { type: string, minLength: 1, maxLength: 6000 }
      responses:
        "200":
          description: Answer and retrieved sources from the caller's allowed knowledge
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [answer, sources, warnings]
                    properties:
                      answer: { type: string }
                      warnings:
                        type: array
                        items: { type: string }
                      sources:
                        type: array
                        maxItems: 5
                        items:
                          type: object
                          required: [id, citation, title, url, excerpt]
                          properties:
                            id: { type: string }
                            citation: { type: string, pattern: '^S[1-5]$' }
                            title: { type: string }
                            url: { type: string, description: Server-owned relative website route }
                            excerpt: { type: string }
        "400":
          $ref: '#/components/responses/Error400'
        "401":
          $ref: '#/components/responses/Error401'
        "403":
          $ref: '#/components/responses/Error403'
        "429":
          $ref: '#/components/responses/Error429'
        "502":
          description: Model returned invalid JSON, embeddings or an empty final answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "503":
          description: Knowledge, index or local model unavailable; no known stale index is used
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "504":
          description: Local model request exceeded CHATBOT_TIMEOUT_MS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /health:
    get:
      tags:
        - Health
      summary: Health check
      operationId: get__health
      description: ""
      security: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      service:
                        type: string
                      timestamp:
                        type: string
                        format: date-time
                    required:
                      - service
                      - timestamp
                required:
                  - data
        "400":
          $ref: "#/components/responses/Error400"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "500":
          $ref: "#/components/responses/Error500"
  /home:
    get:
      tags:
        - Catalog
      summary: Home page sections
      operationId: get__home
      description: ""
      security: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      outstandingCourses:
                        type: array
                        items:
                          $ref: "#/components/schemas/Course"
                      mostViewedCourses:
                        type: array
                        items:
                          $ref: "#/components/schemas/Course"
                      newestCourses:
                        type: array
                        items:
                          $ref: "#/components/schemas/Course"
                      topCategories:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              minimum: 1
                              maximum: 2147483647
                            name:
                              type: string
                            enrollCount:
                              type: integer
                          required:
                            - id
                            - name
                            - enrollCount
                    required:
                      - outstandingCourses
                      - mostViewedCourses
                      - newestCourses
                      - topCategories
                required:
                  - data
        "400":
          $ref: "#/components/responses/Error400"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "500":
          $ref: "#/components/responses/Error500"
  /courses:
    get:
      tags:
        - Catalog
      summary: Search and list courses
      operationId: get__courses
      description: ""
      security: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 12
          description: Page size, capped at 50
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Search phrase
        - name: categoryId
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
          description: Category filter
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - relevance
              - newest
              - popular
              - rating_desc
              - price_asc
              - price_desc
          description: Default relevance with q, newest otherwise
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Course"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
                required:
                  - data
                  - pagination
        "400":
          $ref: "#/components/responses/Error400"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "500":
          $ref: "#/components/responses/Error500"
  /courses/{id}:
    get:
      tags:
        - Catalog
      summary: Course detail and feedbacks
      operationId: get__courses_id_
      description: ""
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CourseDetail"
                required:
                  - data
        "400":
          $ref: "#/components/responses/Error400"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "500":
          $ref: "#/components/responses/Error500"
  /categories:
    get:
      tags:
        - Catalog
      summary: Category tree
      operationId: get__categories
      description: ""
      security: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Category"
                required:
                  - data
        "400":
          $ref: "#/components/responses/Error400"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "500":
          $ref: "#/components/responses/Error500"
  /categories/{id}/courses:
    get:
      tags:
        - Catalog
      summary: Courses in category and children
      operationId: get__categories_id_courses
      description: Also returns category metadata at the envelope root.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 12
          description: Page size, capped at 50
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Course"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
                  category:
                    $ref: "#/components/schemas/Category"
                required:
                  - data
                  - pagination
                  - category
        "400":
          $ref: "#/components/responses/Error400"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "500":
          $ref: "#/components/responses/Error500"
  /auth/username-availability:
    get:
      tags:
        - Auth
      summary: Check username availability
      operationId: get__auth_username_availability
      description: ""
      security: []
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
          description: Candidate username
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      available:
                        type: boolean
                    required:
                      - available
                required:
                  - data
        "400":
          $ref: "#/components/responses/Error400"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
  /auth/csrf-token:
    get:
      tags:
        - Auth
      summary: Read CSRF token for current refresh cookie
      operationId: get__auth_csrf_token
      description: No web session is created. Returns null before login. After reload, call with credentials
        included to recover the refresh CSRF token.
      security: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      csrfToken:
                        type: string
                        nullable: true
                    required:
                      - csrfToken
                required:
                  - data
        "400":
          $ref: "#/components/responses/Error400"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "500":
          $ref: "#/components/responses/Error500"
  /auth/register:
    post:
      tags:
        - Auth
      summary: Register a student and issue tokens
      operationId: post__auth_register
      description: Access token and user are JSON data. Refresh token is only in the HttpOnly academy.refresh
        cookie. CSRF token is returned in JSON. Requests must use application/json and an allowed Origin.
      security: []
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Tokens"
                required:
                  - data
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "415":
          $ref: "#/components/responses/Error415"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Signup"
  /auth/login:
    post:
      tags:
        - Auth
      summary: Login and issue tokens
      operationId: post__auth_login
      description: Access token and user are JSON data. Refresh token is only in the HttpOnly academy.refresh
        cookie. CSRF token is returned in JSON. Requests must use application/json and an allowed Origin.
      security: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Tokens"
                required:
                  - data
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "415":
          $ref: "#/components/responses/Error415"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Login"
  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Rotate refresh token and issue access token
      operationId: post__auth_refresh
      description: Send refresh cookie and its CSRF token. Rotation changes both. Reusing a consumed refresh token
        revokes the entire session, including existing access tokens.
      security:
        - RefreshCookie: []
      parameters:
        - name: x-csrf-token
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Tokens"
                required:
                  - data
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "500":
          $ref: "#/components/responses/Error500"
  /auth/logout:
    post:
      tags:
        - Auth
      summary: Revoke the current token session
      operationId: post__auth_logout
      description: Clears the refresh cookie. The revoked session is rejected immediately; if access expired,
        refresh first. Other device sessions remain active.
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Completed, no response body
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "500":
          $ref: "#/components/responses/Error500"
  /auth/me:
    get:
      tags:
        - Auth
      summary: Current account
      operationId: get__auth_me
      description: ""
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
                required:
                  - data
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "500":
          $ref: "#/components/responses/Error500"
