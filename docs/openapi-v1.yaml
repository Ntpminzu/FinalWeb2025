openapi: 3.0.3
info:
  title: Online Academy REST API
  version: 1.0.0
  description: REST API v1 chạy song song với server-rendered pages.
servers:
  - url: http://localhost:4000/api/v1
    description: Local development
tags:
  - name: Health
  - name: Auth
  - name: Courses
  - name: Categories
  - name: Cart
  - name: Checkout
  - name: Learning
  - name: Reviews

paths:
  /health:
    get:
      tags: [Health]
      summary: Kiểm tra API server còn chạy
      responses:
        '200':
          description: API đang hoạt động
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /courses:
    get:
      tags: [Courses]
      summary: Lấy danh sách khóa học
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: q
          in: query
          schema:
            type: string
          description: Từ khóa tìm kiếm
        - name: categoryId
          in: query
          schema:
            type: integer
            minimum: 1
          description: Lọc theo category
        - name: sort
          in: query
          schema:
            type: string
            enum: [relevance, newest, popular, rating_desc, price_asc, price_desc]
            default: relevance
      responses:
        '200':
          description: Danh sách khóa học
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

  /courses/{id}:
    get:
      tags: [Courses]
      summary: Lấy chi tiết khóa học
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Chi tiết khóa học
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'

  /categories:
    get:
      tags: [Categories]
      summary: Lấy danh sách category
      responses:
        '200':
          description: Danh sách category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'

  /categories/{id}/courses:
    get:
      tags: [Categories, Courses]
      summary: Lấy danh sách khóa học theo category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Danh sách khóa học trong category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

  /auth/csrf-token:
    get:
      tags: [Auth]
      summary: Lấy CSRF token cho session hiện tại
      responses:
        '200':
          description: CSRF token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfTokenResponse'

  /auth/login:
    post:
      tags: [Auth]
      summary: Đăng nhập bằng session cookie
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfError'

  /auth/me:
    get:
      tags: [Auth]
      summary: Lấy user hiện tại từ session
      security:
        - sessionCookie: []
      responses:
        '200':
          description: User hiện tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /cart:
    get:
      tags: [Cart]
      summary: Lấy cart của student hiện tại
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Cart hiện tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Cart]
      summary: Xóa toàn bộ cart
      security:
        - sessionCookie: []
        - csrfHeader: []
      responses:
        '200':
          description: Cart rỗng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /cart/items:
    post:
      tags: [Cart]
      summary: Thêm khóa học vào cart
      security:
        - sessionCookie: []
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCartItemRequest'
      responses:
        '200':
          description: Cart sau khi thêm item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /cart/items/{courseId}:
    delete:
      tags: [Cart]
      summary: Xóa một khóa học khỏi cart
      security:
        - sessionCookie: []
        - csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Cart sau khi xóa item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /checkout:
    post:
      tags: [Checkout]
      summary: Checkout cart hiện tại
      security:
        - sessionCookie: []
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '201':
          description: Checkout lần đầu thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResponse'
        '200':
          description: Replay kết quả cũ do idempotency key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /me/courses:
    get:
      tags: [Learning]
      summary: Lấy khóa học đã mua của student hiện tại
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Danh sách khóa học của tôi
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MyCourse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /me/courses/{courseId}/progress:
    get:
      tags: [Learning]
      summary: Lấy progress của student hiện tại trong một course
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Progress của course
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseProgressResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /me/lectures/{lectureId}/progress:
    patch:
      tags: [Learning]
      summary: Cập nhật progress của một lecture
      security:
        - sessionCookie: []
        - csrfHeader: []
      parameters:
        - name: lectureId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgressRequest'
      responses:
        '200':
          description: Progress đã cập nhật
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /courses/{courseId}/reviews:
    post:
      tags: [Reviews]
      summary: Tạo review cho course
      security:
        - sessionCookie: []
        - csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CourseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
      responses:
        '201':
          description: Review được tạo
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /courses/{courseId}/reviews/me:
    patch:
      tags: [Reviews]
      summary: Cập nhật review của student hiện tại
      security:
        - sessionCookie: []
        - csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CourseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
      responses:
        '200':
          description: Review được cập nhật
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: online_academy.sid
      description: Session cookie do Express session cấp.
    csrfHeader:
      type: apiKey
      in: header
      name: x-csrf-token
      description: CSRF token lấy từ GET /auth/csrf-token.

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 12
    CourseId:
      name: courseId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

  responses:
    ValidationError:
      description: Dữ liệu không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Chưa đăng nhập hoặc session không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Không đủ quyền hoặc không sở hữu resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Trạng thái hiện tại không cho phép thực hiện request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CsrfError:
      description: CSRF token thiếu, sai hoặc hết hạn
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    HealthResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            service:
              type: string
              example: online-academy
            status:
              type: string
              example: ok
            timestamp:
              type: string
              format: date-time

    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 12
        total:
          type: integer
          example: 120
        totalPages:
          type: integer
          example: 10

    Course:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: Node.js Backend
        shortDescription:
          type: string
          nullable: true
        price:
          type: number
          example: 300000
        salePrice:
          type: number
          nullable: true
          example: 199000
        ratingAverage:
          type: number
          example: 4.7
        ratingCount:
          type: integer
          example: 20
        category:
          type: string
          nullable: true
          example: Backend
        instructorName:
          type: string
          nullable: true
          example: Nguyen Van A
        thumbnail:
          type: string
          nullable: true

    CourseListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Course'
        pagination:
          $ref: '#/components/schemas/Pagination'

    CourseResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Course'

    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        children:
          type: array
          items:
            type: object

    CategoryListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Category'

    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        name:
          type: string
        email:
          type: string
        permission:
          type: integer
          enum: [1, 2, 3]

    UserResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/User'

    CsrfTokenResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            csrfToken:
              type: string

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: student1
        password:
          type: string
          example: password123

    CartCourse:
      allOf:
        - $ref: '#/components/schemas/Course'
        - type: object
          properties:
            effectivePrice:
              type: number
              example: 199000

    Cart:
      type: object
      properties:
        courses:
          type: array
          items:
            $ref: '#/components/schemas/CartCourse'
        total:
          type: number
          example: 499000
        empty:
          type: boolean
          example: false

    CartResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            cart:
              $ref: '#/components/schemas/Cart'

    AddCartItemRequest:
      type: object
      required: [courseId]
      properties:
        courseId:
          type: integer
          minimum: 1

    CheckoutRequest:
      type: object
      required: [idempotencyKey, courseIds]
      properties:
        idempotencyKey:
          type: string
          example: checkout-2026-08-04-001
        courseIds:
          type: array
          minItems: 1
          items:
            type: integer
            minimum: 1
          example: [1, 2]

    CheckoutResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            purchased:
              type: integer
              example: 2
            cart:
              $ref: '#/components/schemas/Cart'
            reused:
              type: boolean
              example: false

    MyCourse:
      allOf:
        - $ref: '#/components/schemas/Course'
        - type: object
          properties:
            progressPercent:
              type: number
              example: 75

    CourseProgressResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            course:
              $ref: '#/components/schemas/Course'
            lectures:
              type: array
              items:
                type: object
            feedback:
              type: object
              nullable: true

    ProgressRequest:
      type: object
      properties:
        lastSecond:
          type: integer
          minimum: 0
          example: 120
        watchedPercent:
          type: number
          minimum: 0
          maximum: 100
          example: 80
        isCompleted:
          type: boolean
          example: false

    ReviewRequest:
      type: object
      required: [rating]
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        comment:
          type: string
          example: Khoa hoc rat de hieu

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Du lieu khong hop le.
            status:
              type: integer
              example: 400
            details:
              nullable: true
