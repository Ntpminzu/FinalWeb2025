      tags:
        - Account
      summary: Student watchlist
      operationId: get__me_watchlist
      description: ""
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/Course"
