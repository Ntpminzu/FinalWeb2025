        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "500":
          $ref: "#/components/responses/Error500"
  /me/courses/{courseId}/lectures/{lectureId}:
    get:
      tags:
        - Learning
      summary: Lecture player and resume position
      operationId: get__me_courses_courseId_lectures_lectureId_
      description: ""
      security:
        - BearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
