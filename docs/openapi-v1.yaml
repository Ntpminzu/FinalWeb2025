      summary: Add to watchlist (idempotent)
      operationId: post__me_watchlist_items
      description: ""
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      courseId:
                        type: integer
                        minimum: 1
                        maximum: 2147483647
                      inWatchlist:
                        type: boolean
                    required:
                      - courseId
                      - inWatchlist
                required:
                  - data
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "500":
          $ref: "#/components/responses/Error500"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                courseId:
                  type: integer
                  minimum: 1
                  maximum: 2147483647
              required:
                - courseId
  /me/watchlist/items/{courseId}:
    delete:
      tags:
        - Account
      summary: Remove from watchlist
      operationId: delete__me_watchlist_items_courseId_
      description: ""
      security:
