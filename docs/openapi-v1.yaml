components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    RefreshCookie:
      type: apiKey
      in: cookie
      name: academy.refresh
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            status:
              type: integer
          required:
            - code
            - message
            - status
      required:
        - error
    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
      required:
        - page
        - limit
        - total
        - totalPages
    User:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
          maximum: 2147483647
        username:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        dob:
          type: string
          format: date
          nullable: true
        permission:
          type: integer
          enum:
            - 1
            - 2
            - 3
        role:
          type: string
          enum:
            - student
            - instructor
            - admin
      required:
        - id
        - username
        - name
        - email
        - dob
        - permission
        - role
    Course:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
          maximum: 2147483647
        title:
          type: string
        shortDescription:
          type: string
          nullable: true
        price:
          type: number
        salePrice:
          type: number
          nullable: true
        ratingAverage:
          type: number
        ratingCount:
          type: integer
        category:
          type: string
          nullable: true
        instructorName:
          type: string
          nullable: true
        thumbnail:
          type: string
          nullable: true
      required:
        - id
        - title
        - shortDescription
        - price
        - salePrice
        - ratingAverage
        - ratingCount
        - category
        - instructorName
        - thumbnail
    CourseDetail:
      allOf:
        - $ref: "#/components/schemas/Course"
        - type: object
          properties:
            fullDescription:
              type: string
              nullable: true
            instructorBio:
              type: string
              nullable: true
            instructorSpecialization:
              type: string
              nullable: true
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            feedbacks:
              type: array
              items:
                $ref: "#/components/schemas/Feedback"
          required:
            - fullDescription
            - instructorBio
            - instructorSpecialization
            - createdAt
            - updatedAt
            - feedbacks
    Feedback:
      type: object
      properties:
        studentName:
          type: string
          nullable: true
        rating:
          type: number
        comment:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - studentName
        - rating
        - comment
        - createdAt
    Category:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
          maximum: 2147483647
        catname:
          type: string
        parent_id:
          type: integer
          minimum: 1
          maximum: 2147483647
          nullable: true
        children:
          type: array
          items:
            $ref: "#/components/schemas/Category"
      required:
        - id
        - catname
        - parent_id
        - children
    CategoryAdmin:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
          maximum: 2147483647
        name:
          type: string
        courseCount:
          type: integer
      required:
        - id
        - name
        - courseCount
    Lecture:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
          maximum: 2147483647
        title:
          type: string
        videoUrl:
          type: string
          nullable: true
        durationSec:
          type: integer
          nullable: true
        orderIndex:
          type: integer
      required:
        - id
        - title
        - videoUrl
        - durationSec
        - orderIndex
    Progress:
      type: object
      properties:
        lectureId:
          type: integer
          minimum: 1
          maximum: 2147483647
        lastSecond:
          type: number
        watchedPercent:
          type: number
        isCompleted:
          type: boolean
      required:
        - lectureId
        - lastSecond
        - watchedPercent
        - isCompleted
    Completion:
      type: object
      properties:
        total:
          type: integer
        done:
          type: integer
        percent:
          type: integer
      required:
        - total
        - done
        - percent
    CourseProgress:
      type: object
      properties:
        courseId:
          type: integer
          minimum: 1
          maximum: 2147483647
        lectures:
          type: array
          items:
            $ref: "#/components/schemas/Lecture"
        feedbacks:
          type: array
          items:
            $ref: "#/components/schemas/Feedback"
        progress:
          type: array
          items:
            $ref: "#/components/schemas/Progress"
        completion:
          $ref: "#/components/schemas/Completion"
      required:
        - courseId
        - lectures
        - feedbacks
        - progress
        - completion
    LectureDetail:
      type: object
      properties:
        courseId:
          type: integer
          minimum: 1
          maximum: 2147483647
        lectures:
          type: array
          items:
            $ref: "#/components/schemas/Lecture"
        current:
          $ref: "#/components/schemas/Lecture"
        progress:
          $ref: "#/components/schemas/Progress"
      required:
        - courseId
        - lectures
        - current
        - progress
    Cart:
      type: object
      properties:
        courses:
          type: array
          items:
            $ref: "#/components/schemas/Course"
        total:
          type: number
        empty:
          type: boolean
      required:
        - courses
        - total
        - empty
    Checkout:
      type: object
      properties:
        purchased:
          type: integer
        reused:
          type: boolean
        cart:
          $ref: "#/components/schemas/Cart"
      required:
        - purchased
        - reused
        - cart
    Tokens:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum:
            - Bearer
        expiresIn:
          type: integer
        csrfToken:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required:
        - accessToken
        - tokenType
        - expiresIn
        - csrfToken
    Signup:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: ^[a-zA-Z0-9._-]+$
        name:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
        dob:
          type: string
          format: date
          nullable: true
        password:
          type: string
          minLength: 8
          maxLength: 72
        confirmPassword:
          type: string
      required:
        - username
        - name
        - email
        - password
        - confirmPassword
    Login:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password
    ProfilePatch:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        email:
